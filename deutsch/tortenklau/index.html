<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Der Tortenklau</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: iOS-Stil – gruppierter grauer Grund, weiße Karten mit großem Radius, Milchglas-Fortschrittsleiste oben */
:root{
  --bg:#f2f2f7; --paper:#ffffff; --ink:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea; --fill:#f2f2f7;
  --accent:#0071e3; --accent-ink:#ffffff; --tint:rgba(0,113,227,.10);
  --choc:#1d1d1f; --good:#248a3d; --good-bg:#eaf7ee; --bad:#d70015; --bad-bg:#fdeced;
  --bar:rgba(242,242,247,.78); --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --rounded:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --paper:#1c1c1e; --ink:#f5f5f7; --muted:#98989d; --line:#38383a; --fill:#2c2c2e;
  --accent:#2997ff; --accent-ink:#ffffff; --tint:rgba(41,151,255,.16);
  --choc:#f5f5f7; --good:#30d158; --good-bg:#11291a; --bad:#ff453a; --bad-bg:#331414;
  --bar:rgba(0,0,0,.72); --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --paper:#1c1c1e; --ink:#f5f5f7; --muted:#98989d; --line:#38383a; --fill:#2c2c2e;
  --accent:#2997ff; --accent-ink:#ffffff; --tint:rgba(41,151,255,.16);
  --choc:#f5f5f7; --good:#30d158; --good-bg:#11291a; --bad:#ff453a; --bad-bg:#331414;
  --bar:rgba(0,0,0,.72); --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.55;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);font-weight:700;letter-spacing:-.025em;text-wrap:balance;margin:0;line-height:1.08}
h1{font-size:clamp(2.4rem,8vw,3.5rem);color:var(--ink)}
h2{font-size:1.75rem;color:var(--ink)}
/* Fortschritt */
.trail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:6px;
  padding:12px 14px;margin-inline:-6px;border-radius:18px;background:var(--bar);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border:1px solid var(--line)}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.paw{width:100%;height:30px;border-radius:999px;display:grid;place-items:center;background:var(--fill);
  font-family:var(--rounded);font-weight:700;font-size:.95rem;color:var(--muted);transition:background .3s,color .3s,transform .3s}
.step.done .paw{background:var(--accent);color:var(--accent-ink)}
.step.now .paw{background:var(--tint);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.step small{font-size:.68rem;color:var(--muted);font-weight:500}
/* Karten */
.card{background:var(--paper);border-radius:22px;padding:26px 28px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.station{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:600;margin:0}
.story p{margin:0 0 .8em;max-width:62ch}
.story p:last-child{margin:0}
.q{font-weight:600;font-size:1.12rem;margin:0;display:flex;gap:10px;align-items:flex-start;letter-spacing:-.015em}
.q .mag{font-size:1.2rem;line-height:1.4}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 26px;font-weight:600;font-size:1.02rem;align-self:flex-start;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--tint);color:var(--accent)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
/* Rückmeldungen */
.status{border-radius:16px;padding:14px 18px;background:var(--fill);font-size:1rem;display:flex;flex-direction:column;gap:10px}
.status p{margin:0}
.status.good{background:var(--good-bg)}
.status.bad{background:var(--bad-bg)}
.status h3{margin:0;font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:-.02em}
.status.good h3{color:var(--good)} .status.bad h3{color:var(--bad)}
.letter{font-family:var(--rounded);font-weight:700;font-size:2rem;color:var(--accent);line-height:1;vertical-align:-4px}
/* Lösungswort */
.word{display:flex;gap:8px;flex-wrap:wrap}
.word span{width:44px;height:52px;border-radius:12px;display:grid;place-items:center;background:var(--accent);
  font-family:var(--rounded);font-weight:700;font-size:1.6rem;color:var(--accent-ink)}
.word span.empty{background:var(--fill);color:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.intro-art{font-size:3rem;line-height:1;margin-bottom:10px}
.meta{color:var(--muted);font-size:.95rem;margin:0}
.home{color:var(--accent);font-weight:500;text-decoration:none;font-size:1rem}
.home:hover{text-decoration:underline}
/* Suchbild */
.scene{border-radius:16px;overflow:hidden;background:#f6e7c8;line-height:0;box-shadow:inset 0 0 0 1px var(--line)}
.scene svg{width:100%;height:auto;display:block;touch-action:manipulation}
.scene .item{cursor:pointer}
.scene .hit{fill:transparent}
.scene.locked .item{cursor:default}
.ring{fill:none;stroke:#248a3d;stroke-width:6;animation:pop .35s cubic-bezier(.2,.9,.3,1.3)}
.ringcheck{fill:#248a3d}
.cross{stroke:#d70015;stroke-width:6;stroke-linecap:round;animation:fade 1.2s ease-out forwards}
@keyframes pop{from{transform-box:fill-box;transform-origin:center;transform:scale(.4);opacity:0}to{transform-box:fill-box;transform-origin:center;transform:scale(1);opacity:1}}
@keyframes fade{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (max-width:480px){body{font-size:17px}.card{padding:20px 18px;border-radius:18px}.step small{display:none}.paw{height:26px;font-size:.85rem}.trail{gap:4px;padding:10px}.word span{width:34px;height:42px;font-size:1.3rem}}
@media (prefers-reduced-motion:reduce){.paw,.btn{transition:none}.ring,.shake{animation:none}}
</style>
</head>

const WORD = STATIONS.map(s=>s.letter);
const app = document.getElementById("app");
let state = {screen:"intro", i:0, found:[], miss:0, solved:false, msg:null};

function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function trail(){
  return `<nav class="trail" aria-label="Fortschritt">${STATIONS.map((s,k)=>{
    const cls = k<state.found.length ? "done" : (k===state.i && state.screen==="station" ? "now":"");
    return `<div class="step ${cls}"><div class="paw">${k<state.found.length?s.letter:k+1}</div><small>Station ${k+1}</small></div>`}).join("")}</nav>`;
}
function word(){
  return `<div class="word" aria-label="Lösungswort">${WORD.map((l,k)=>`<span class="${k<state.found.length?"":"empty"}">${k<state.found.length?l:"·"}</span>`).join("")}</div>`;
}
function reset(){state={screen:"intro",i:0,found:[],miss:0,solved:false,msg:null}}

function render(){
  if(state.screen==="intro"){
    app.innerHTML = `
    <header style="padding:28px 4px 4px"><div class="intro-art" aria-hidden="true">🎂</div><p class="station" style="margin-bottom:6px">Lesespur · Klasse 4</p><h1>Der Tortenklau</h1></header>
    <section class="card">
            <p style="margin:0">Die Geburtstagstorte von Hausmeister Herrn Krümel ist verschwunden! Hilf den Detektiven Lea und Can, den Tortendieb zu finden.</p>
      <p style="margin:0"><strong>So geht's:</strong> Lies jede Station genau. Unter dem Text ist ein Suchbild. Klicke im Bild auf das Ding, nach dem gefragt wird. Wenn du richtig liegst, bekommst du einen Buchstaben und darfst weiter. Am Ende ergeben alle 8 Buchstaben das Lösungswort.</p>
      ${word()}
      <button class="btn" id="start">Fall übernehmen</button>
    </section>`;
    document.getElementById("start").onclick=()=>{state.screen="station";render();focusTop()};
    return;
  }
  if(state.screen==="end"){
    app.innerHTML = `${trail()}
    <section class="card">
      <h1>Fall gelöst!</h1>
      <p style="margin:0">Super gelesen, Detektiv! Der Tortendieb war Herr Krümel selbst, und Professor Pummel hat ein bisschen mitgenascht.</p>
      <p class="station">Dein Lösungswort</p>
      ${word()}
      <p class="meta">${state.miss===0?"Kein einziger Fehlklick. Du bist ein Meisterdetektiv!":`Du hast ${state.miss}-mal auf eine falsche Spur geklickt. Beim nächsten Mal schaffst du es noch genauer!`}</p>
      <button class="btn" id="again">Noch einmal spielen</button>
    </section>`;
    document.getElementById("again").onclick=()=>{reset();render();focusTop()};
    return;
  }
  const s = STATIONS[state.i];
  let status = "";
  if(state.solved){
    status = `<div class="status good" role="status"><h3>Richtig! Gute Spur!</h3>
      <p>Du findest den Buchstaben <span class="letter">${s.letter}</span></p>
      <button class="btn" id="next">${state.i<STATIONS.length-1?"Weiter zu Station "+(state.i+2):"Zum Lösungswort"}</button></div>`;
  } else if(state.msg){
    status = `<div class="status bad" role="status" id="status"><h3>Falsche Spur!</h3><p>${esc(state.msg)}</p></div>`;
  } else {
    status = `<div class="status" role="status" id="status"><p>Klicke im Bild auf die richtige Stelle.</p></div>`;
  }
  app.innerHTML = `${trail()}
  <section class="card">
    <p class="station">Station ${state.i+1} von ${STATIONS.length}</p>
    <h2>${s.title}</h2>
    <div class="story">${s.text.map(p=>`<p>${esc(p)}</p>`).join("")}</div>
  </section>
  <section class="card">
    <p class="q"><span class="mag" aria-hidden="true">🔍</span><span>${esc(s.q)}</span></p>
    <div class="scene ${state.solved?"locked":""}" id="scene">${SCENE}</div>
    ${status}
  </section>
  <section class="card"><p class="station">Lösungswort</p>${word()}</section>`;

  const svg = app.querySelector("#scene svg");
  // bereits gelöste Stationen bleiben im Bild grün markiert
  STATIONS.slice(0, state.found.length).forEach(st=>markFound(svg, st.target));
  svg.addEventListener("click", e=>{
    if(state.solved) return;
    const g = e.target.closest(".item"); if(!g) return;
    const id = g.dataset.id;
    if(id===s.target){
      state.found.push(s.letter); state.solved=true; state.msg=null;
      render();
      const n=document.getElementById("next"); if(n){ n.focus({preventScroll:true}); n.scrollIntoView({block:"nearest",behavior:"smooth"}); }
      return;
    }
    if(STATIONS.slice(0,state.found.length).some(st=>st.target===id)){
      showMsg("Das hast du schon an einer früheren Station gefunden. Jetzt ist etwas anderes gesucht!", null); return;
    }
    state.miss++;
    const msg = s.wrong[id] || (STORY_ITEMS.includes(id) ? STORY_DEFAULT : TRAP_DEFAULT);
    showMsg(msg, svg, g);
  });
  const n=document.getElementById("next");
  if(n) n.onclick=()=>{state.solved=false; state.msg=null; if(state.i<STATIONS.length-1){state.i++;}else{state.screen="end"} render(); focusTop()};
}
function showMsg(msg, svg, g){
  state.msg = msg;
  const st = document.getElementById("status");
  st.className = "status bad";
  st.innerHTML = `<h3>Falsche Spur!</h3><p>${esc(msg)}</p>`;
  st.classList.remove("shake"); void st.offsetWidth; st.classList.add("shake");
  if(svg && g) markWrong(svg, g);
}
const NS="http://www.w3.org/2000/svg";
function center(svg,g){
  const hit=g.querySelector(".hit"); const b=hit.getBBox();
  return {cx:b.x+b.width/2, cy:b.y+b.height/2 + (g.dataset.id==="pummel"?-16:0) , r:Math.min(Math.max(b.width,b.height)/2+6, 120), x:(g.dataset.id==="handschuh"?140:0)};
}
function markFound(svg,id){
  const g = svg.querySelector(`.item[data-id="${id}"]`); if(!g) return;
  let {cx,cy,r,x} = center(svg,g); cx+=x;
  if(id==="besen") r=60, cy=440, cx=735;
  const c=document.createElementNS(NS,"circle"); c.setAttribute("cx",cx); c.setAttribute("cy",cy); c.setAttribute("r",r); c.setAttribute("class","ring");
  const t=document.createElementNS(NS,"circle"); t.setAttribute("cx",cx+r*0.7); t.setAttribute("cy",cy-r*0.7); t.setAttribute("r",13); t.setAttribute("class","ringcheck");
  const p=document.createElementNS(NS,"path"); p.setAttribute("d",`M${cx+r*0.7-6} ${cy-r*0.7} l4 5 l8 -9`); p.setAttribute("stroke","#fff"); p.setAttribute("stroke-width","3"); p.setAttribute("fill","none");
  [c,t,p].forEach(el=>{el.style.pointerEvents="none"; svg.appendChild(el)});
}
function markWrong(svg,g){
  let {cx,cy,x} = center(svg,g); cx+=x;
  if(g.dataset.id==="besen"){cx=740;cy=400}
  const p=document.createElementNS(NS,"path");
  p.setAttribute("d",`M${cx-16} ${cy-16} L${cx+16} ${cy+16} M${cx+16} ${cy-16} L${cx-16} ${cy+16}`);
  p.setAttribute("class","cross"); p.style.pointerEvents="none";
  svg.appendChild(p); setTimeout(()=>p.remove(),1300);
}
function focusTop(){try{window.scrollTo({top:0,behavior:"smooth"})}catch(e){window.scrollTo(0,0)}}
render();
</script>
